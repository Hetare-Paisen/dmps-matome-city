<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>デュエマシティ・掲示板</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);
            color: #334155;
        }
        header { background-color: #0284c7; color: white; padding: 15px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        
        /* ヒヨコ（全身）と吹き出しのコンテナ */
        .guide-container {
            display: flex;
            align-items: flex-end; /* 足が地面に着くように下揃えに */
            max-width: 1000px;
            margin: 0 auto 10px auto;
            gap: 15px;
            height: 70px; /* 全身が入るように高さを確保 */
        }

        /* 💡 プログラミングで描く「全身のひよこ」 */
        .chick-character {
            width: 46px;
            height: 52px;
            background-color: #ffb74d; /* 明るい薄オレンジ */
            border-radius: 50% 50% 45% 45%; 
            position: relative;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            flex-shrink: 0; 
            margin-bottom: 8px; /* 足のスペース分、少し浮かせる */
        }
        /* つぶらな目 */
        .chick-character::before {
            content: ''; position: absolute; top: 16px; left: 12px; width: 5px; height: 5px;
            background: #334155; border-radius: 50%; box-shadow: 16px 0 0 #334155; 
        }
        /* クチバシ */
        .chick-character::after {
            content: ''; position: absolute; top: 20px; left: 19px; width: 0; height: 0;
            border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 6px solid #f57c00; 
        }
        /* 小さな羽と可愛い2本の足 */
        .chick-wings-legs {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0;
        }
        /* 左羽・右羽 */
        .chick-wings-legs::before {
            content: ''; position: absolute; top: 24px; left: -4px; width: 6px; height: 14px;
            background-color: #ffa726; border-radius: 10px 0 0 10px;
            box-shadow: 48px 0 0 #ffa726; /* 右側の羽を反転色としてシャドウで表現 */
        }
        /* 2本の足 */
        .chick-wings-legs::after {
            content: ''; position: absolute; bottom: -8px; left: 14px; width: 4px; height: 8px;
            background-color: #f57c00; border-radius: 2px;
            box-shadow: 14px 0 0 #f57c00; /* 右足をシャドウで表現 */
        }

        .speech-bubble {
            position: relative; background: #ffffff; color: #1e293b; border-radius: 10px;
            padding: 8px 14px; font-size: 0.85em; font-weight: bold; box-shadow: 0 3px 6px rgba(0,0,0,0.1); border: 2px solid #ffb74d; 
            margin-bottom: 12px; /* ヒヨコの体の中心に吹き出しが来るように調整 */
        }
        .speech-bubble::after { content: ''; position: absolute; left: -10px; top: 50%; transform: translateY(-50%); border-style: solid; border-width: 6px 10px 6px 0; border-color: transparent #ffffff transparent transparent; z-index: 2; }
        .speech-bubble::before { content: ''; position: absolute; left: -13px; top: 50%; transform: translateY(-50%); border-style: solid; border-width: 7px 11px 7px 0; border-color: transparent #ffb74d transparent transparent; z-index: 1; }

        .header-main { max-width: 1000px; margin: 0 auto; text-align: center; }
        .header-main h1 { margin: 0; font-size: 1.6em; }
        .nav-container { display: flex; justify-content: center; gap: 15px; margin-top: 15px; }
        .nav-link { background-color: rgba(15, 23, 42, 0.85); color: #f8fafc; text-decoration: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; }
        .bbs-container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        h2 { border-bottom: 3px solid #0284c7; padding-bottom: 5px; color: #0369a1; }
        .group-1-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .board-card {
            background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border-top: 4px solid #0284c7; text-decoration: none; color: inherit; transition: transform 0.2s;
        }
        .board-card:hover { transform: translateY(-3px); background-color: #f0f9ff; }
        .board-card h3 { margin: 0 0 10px 0; color: #0284c7; }
        .board-card p { margin: 0; font-size: 0.9em; color: #64748b; }
        .group-2-list { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); padding: 10px 20px; }
        .thread-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #e2e8f0; }
        .thread-item:last-child { border-bottom: none; }
        .thread-info a { text-decoration: none; color: #1e293b; font-weight: bold; font-size: 1.05em; }
        .thread-info a:hover { color: #0284c7; }
        .thread-meta { font-size: 0.85em; color: #94a3b8; margin-top: 5px; }
        .create-btn { background-color: #10b981; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; float: right; margin-top: -45px; }
    </style>
</head>
<body>

    <header>
        <div class="guide-container">
            <!-- 全身バージョンのヒヨコ構造 -->
            <div class="chick-character">
                <div class="chick-wings-legs"></div>
            </div>
            <div class="speech-bubble">ここは皆さんが交流や情報交換をする部屋ですよ〜</div>
        </div>

        <div class="header-main">
            <h1>プレイヤー交流掲示板</h1>
            <div class="nav-container">
                <a href="index.html" class="nav-link">トップページ</a>
                <a href="balance.html" class="nav-link">能力調整まとめ</a>
                <a href="bbs.html" class="nav-link">コミュニティ掲示板</a>
            </div>
        </div>
    </header>

    <div class="bbs-container">
        <h2>基本掲示板（グループ1）</h2>
        <div class="group-1-grid">
            <a href="thread.html" class="board-card">
                <h3>💬 総合掲示板</h3>
                <p>雑談やデュエプレに関する主な会話はこちらで！</p>
            </a>
            <a href="#" class="board-card">
                <h3>⚔️ 攻略・質問</h3>
                <p>デッキビルドの相談、プレイングの質問など。</p>
            </a>
            <a href="#" class="board-card">
                <h3>🤝 フレンド募集</h3>
                <p>プレイヤーIDを貼って、友達になってくれる相手を探そう。</p>
            </a>
            <a href="#" class="board-card">
                <h3>⚠️ バグ・不具合報告</h3>
                <p>ゲーム内の挙動がおかしいと感じたらこちらへ。</p>
            </a>
        </div>

        <h2>ユーザー作成スレッド（グループ2）</h2>
        <button class="create-btn">＋ 新しいスレッドを立てる</button>
        <div class="group-2-list">
            <div class="thread-item">
                <div class="thread-info">
                    <a href="#">(例)【第XX弾】新カードの評価を語るスレ</a>
                    <div class="thread-meta">投稿日: 2026/09/17 | 書き込み数: 32</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
